[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=always
RestartSec=10s
MemoryAccounting=true
MemoryHigh=1G
MemoryMax=1280M
MemorySwapMax=1G
CPUAccounting=true
CPUQuota=75%
CPUWeight=50
IOAccounting=true
IOWeight=50
TasksMax=256
LimitNOFILE=4096
OOMPolicy=stop
Environment=PATH=/home/ubuntu/.hermes/node/bin:/home/ubuntu/.hermes/bin:/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin
